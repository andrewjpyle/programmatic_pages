name: Feature request
description: Suggest a new capability or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, skim the [roadmap](../README.md#roadmap) and existing issues to see if this is already on the list.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation matters more than the proposed solution. What are you trying to do?
      placeholder: |
        I'm trying to X. Today I have to Y, which is painful because Z.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? API sketch, flag name, behavior change, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try, and why didn't it fit?

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links to similar libraries, prior art, related issues.
