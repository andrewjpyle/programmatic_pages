name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1", "5.2"]
        exclude:
          # Trimmed to keep the matrix fast; 5.1 and 5.2 still run on 3.11 and 3.12.
          - { python-version: "3.10", django-version: "5.1" }
          - { python-version: "3.10", django-version: "5.2" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django-version }}.0"

      - name: Lint
        run: ruff check .

      - name: Tests (fails if fewer tests ran than the floor, so a gutted suite cannot pass)
        run: |
          set -o pipefail
          pytest -q --junitxml=junit.xml | tee pytest.txt
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          FLOOR = 27
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          ran = int(suite.get("tests")) - int(suite.get("skipped", 0))
          bad = int(suite.get("failures")) + int(suite.get("errors"))
          print(f"tests run: {ran}, failed or errored: {bad}, floor: {FLOOR}")
          sys.exit(1 if bad or ran < FLOOR else 0)
          PY

      - name: Parks demo builds and every page checks out
        working-directory: examples/parks_demo
        run: |
          set -o pipefail
          python manage.py migrate -v0
          python seed.py
          python manage.py build_static_pages --project parks \
            --adapter parks.adapters.ParkPageAdapter --output-dir ./build | tee build.txt
          grep -q "Built 5 pages (0 errors)" build.txt
          python check_build.py ./build
